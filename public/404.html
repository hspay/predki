:root{--ultra:#2533FF;--berlin:#0B1352;--paper:#F4F2EC;--white:#FFFFFF;
  --head:"Sofia Sans Extra Condensed","Arial Narrow",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:max(40px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom));text-align:center;
  font:16px/1.55 var(--body);color:var(--white);-webkit-font-smoothing:antialiased;background-color:var(--ultra);
  background-image:radial-gradient(42% 36% at 50% 46%,rgba(255,255,255,.16),transparent 78%),radial-gradient(rgba(255,255,255,.1) 1.2px,transparent 1.5px);background-size:100% 100%,22px 22px}
a{color:inherit}
.mark{display:block;width:44px;opacity:.95;transition:transform .2s}
.mark:hover{transform:rotate(-8deg)}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.7)}

/* the split-flap board, as on the landing */
.sf{--cw:min(132px,calc((100vw - 32px - 2 * 8px) / 3.3));display:inline-flex;gap:8px;perspective:620px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sf-c{--d:70ms;position:relative;width:var(--cw);height:calc(var(--cw) * 1.36);border-radius:calc(var(--cw) * .1);background:#0C0C0F;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 18px 34px -14px rgba(5,8,60,.8);font:800 calc(var(--cw) * 1.12)/1 var(--head);color:var(--white)}
.sf-h{position:absolute;left:0;right:0;height:50%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sf-h b{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;font:inherit;line-height:1;padding-top:.06em}
.sf-top,.sf-ft{top:0;border-radius:calc(var(--cw) * .1) calc(var(--cw) * .1) 0 0;background:#18181C}
.sf-top b,.sf-ft b{top:0}
.sf-bot,.sf-fb{bottom:0;border-radius:0 0 calc(var(--cw) * .1) calc(var(--cw) * .1);background:#111114}
.sf-bot b,.sf-fb b{top:-100%}
.sf-c::after{content:"";position:absolute;left:0;right:0;top:calc(50% - .75px);height:1.5px;background:#000;z-index:3}
.sf-ft{transform-origin:50% 100%;z-index:2;visibility:hidden}
.sf-fb{transform-origin:50% 0%;z-index:2;transform:rotateX(90deg);visibility:hidden}
.sf-c.go .sf-ft{visibility:visible;animation:sfTop var(--d) ease-in forwards}
.sf-c.go .sf-fb{visibility:visible;animation:sfBot var(--d) ease-out var(--d) forwards}
@keyframes sfTop{0%{transform:rotateX(0deg);filter:brightness(1)}100%{transform:rotateX(-90deg);filter:brightness(.55)}}
@keyframes sfBot{0%{transform:rotateX(90deg);filter:brightness(1.4)}100%{transform:rotateX(0deg);filter:brightness(1)}}

h1{font:800 clamp(34px,7vw,56px)/.95 var(--head);letter-spacing:.01em;text-transform:uppercase}
p{max-width:420px;color:rgba(255,255,255,.84);text-wrap:pretty}
.btn{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 28px;border-radius:10px;background:var(--white);color:var(--ultra);text-decoration:none;
  font:800 20px/1 var(--head);letter-spacing:.05em;text-transform:uppercase;box-shadow:0 4px 0 rgba(11,19,82,.5);transition:filter .2s,transform .1s,box-shadow .1s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(11,19,82,.5)}
.btn:focus-visible,.sf:focus-visible,.mark:focus-visible{outline:3px solid var(--white);outline-offset:4px;border-radius:10px}
.txt{display:flex;flex-direction:column;align-items:center;gap:12px}

    <p id="p">Эта ветка ещё не нарисована: возможно, ссылка устарела или в адресе опечатка. Ваше древо ждёт на главной.</p>
  </div>
  <a class="btn" id="home" href="/">На главную</a>
<script>
(function () {
  // the language the visitor picked in the app; otherwise the browser's
  var en = false
  try { var l = localStorage.getItem('predki:lang'); en = l ? l === 'en' : !/^ru|^uk|^be|^kk/i.test(navigator.language || 'ru') } catch (e) {}
  if (en) {
    document.documentElement.lang = 'en'; document.title = 'Page not found · Predki'
    document.getElementById('eb').textContent = 'Error'
    document.getElementById('h').textContent = 'No such page'
    document.getElementById('p').textContent = 'This branch has not been drawn yet: the link may be out of date, or there is a typo in the address. Your tree is waiting on the home page.'
    document.getElementById('home').textContent = 'Go home'
  } else document.getElementById('eb').textContent = 'Ошибка'

  // the board flips through a few random characters and lands on 4 0 4, a little after its left neighbour
  var board = document.getElementById('board'), cells = [].slice.call(board.querySelectorAll('.sf-c'))
  var ABC = '0123456789АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ?', TARGET = '404', timers = []
  var state = cells.map(function () { return ' ' })
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
  function q(c, s) { return c.querySelector(s + ' b') }
  function flipTo(i, ch, dur) {
    var c = cells[i], cur = state[i]; state[i] = ch
    q(c, '.sf-top').textContent = ch; q(c, '.sf-bot').textContent = cur; q(c, '.sf-ft').textContent = cur; q(c, '.sf-fb').textContent = ch
    c.style.setProperty('--d', dur + 'ms'); c.classList.remove('go'); void c.offsetWidth; c.classList.add('go')
    timers.push(setTimeout(function () { q(c, '.sf-bot').textContent = ch }, dur))
  }
  function run(first) {
    timers.forEach(clearTimeout); timers = []
    if (reduced) return
    cells.forEach(function (c, i) {
      var steps = 6 + i * 3 + Math.floor(Math.random() * 3), D = 70
      for (var k = 0; k <= steps; k++) (function (k) {
        var ch = k === steps ? TARGET[i] : ABC[Math.floor(Math.random() * ABC.length)]
        timers.push(setTimeout(function () { flipTo(i, ch, D) }, (first ? 350 : 0) + i * 90 + k * (D + 10)))
      })(k)
    })
  }
  if (!reduced) { cells.forEach(function (c, i) { state[i] = ' '; [].forEach.call(c.querySelectorAll('.sf-h b'), function (b) { b.textContent = '' }) }) }
  run(true)
  board.addEventListener('click', function () { run(false) })
  board.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); run(false) } })
})()
</script>
