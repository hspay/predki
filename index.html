    <meta charset="utf-8" />

    <meta name="description" content="Конструктор семейного древа и архив" />

    <meta property="og:type" content="website" />

    <meta property="og:title" content="Predki" />
    <meta property="og:description" content="Конструктор семейного древа и архив" />
    <meta property="og:url" content="https://predki.me/" />
    <meta property="og:image" content="https://predki.me/og.jpg" />

    <meta property="og:image:height" content="630" />

    <meta name="apple-mobile-web-app-title" content="Predki" />
    <meta name="theme-color" content="#07090F" />
    <script>
      // pick the light or dark theme before the first paint, so the app never flashes the wrong one
      try { var a = localStorage.getItem('predki:appearance'); var t = a === 'light' ? 'light' : a === 'auto' && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.dataset.theme = t; if (t === 'light') { document.querySelector('meta[name="theme-color"]').content = '#E8EAE5'; document.querySelector('meta[name="color-scheme"]').content = 'light' } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
